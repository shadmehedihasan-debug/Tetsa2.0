<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tetsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #ffffff;
  --wash: #bae6fd;
  --wash-soft: #e0f2fe;
  --ring: #7dd3fc;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --disc: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --err: #b91c1c;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body.intro-mode { overflow: hidden; height: 100%; }
html:has(body.intro-mode) { height: 100%; }
.stage {
  position: relative;
  height: 100vh;
  height: 100dvh;
  display: grid;
  place-items: center;
}

.content {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(28px, 6vh, 48px);
  padding: 24px;
  text-align: center;
}
/* light sky blue circle: grows from its middle, stays a bounded circle */
.disc {
  position: relative;
  width: clamp(220px, 44vmin, 380px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--wash);
  border: 6px solid #162945;
  display: grid; place-items: center;
}
.content > .disc {
  opacity: 1;
  transform: scale(0);
  animation: grow 1.3s cubic-bezier(.16,.8,.24,1) .1s forwards;
}
@keyframes grow { to { transform: scale(1); } }
.disc img { width: 58%; height: auto; opacity: 0; animation: show .5s ease .9s forwards; filter: drop-shadow(0 8px 8px rgba(15,23,42,.28)); }
.disc .lens { transform-box: fill-box; transform-origin: center; animation: focus 3.4s ease-in-out 1.2s 1; }
@keyframes focus { 0%,100% { transform: scale(1); } 45% { transform: scale(1.22); } }

.stage h1 { margin: 0; font-size: clamp(2.1rem, 5vw, 2.9rem); font-weight: 700; letter-spacing: 0.16em; text-indent: 0.16em; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 1rem; font-weight: 500; }

.btn {
  appearance: none; border: 0; cursor: pointer;
  background: var(--blue); color: #fff;
  font: 600 1.0625rem/1 "Manrope", system-ui, sans-serif;
  padding: 16px 34px; min-width: 220px;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: background .15s, transform .08s;
}
.btn:hover { background: var(--blue-dark); }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.btn[disabled] { cursor: progress; background: var(--blue-dark); }
.spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: rot .8s linear infinite; display: none; }
.btn[disabled] .spin { display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }
.stage h1, .sub, .btn, .version { text-transform: uppercase; }
.sub { letter-spacing: 0.14em; text-indent: 0.14em; }
.btn { letter-spacing: 0.08em; }
.version { letter-spacing: 0.08em; }
.status { min-height: 1.4em; margin: 0; font-size: .95rem; color: var(--muted); }
.status.err { color: var(--err); }

/* single reveal after the wash starts */
.content > * { opacity: 0; animation: show .6s ease 0.9s forwards; }
.content > .actions { animation-delay: 1.2s; }
@keyframes show { to { opacity: 1; } }

.version {
  position: fixed;
  right: 16px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font-size: .75rem;
  font-weight: 500;
  color: var(--muted);
  opacity: .8;
}
@media (prefers-reduced-motion: reduce) {
  .content > .disc { animation: none; transform: scale(1); }
  .disc img { animation: none; opacity: 1; }
  .content > * { animation: none; opacity: 1; }
  .disc .lens { animation: none; }
}

.actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.btn.ghost { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
.btn.ghost:hover { background: var(--wash-soft); }
#intro[hidden], #dashboard[hidden] { display: none; }

#dashboard { --navy: #162945; --sky: #bae6fd; --ink: #334155; --circle: clamp(60px, 9vw, 112px); --pad: clamp(4px, 0.6vw, 8px); }

/* sky blue region with a very thick navy outline; wide band on the left */
.page {
  display: grid;
  grid-template-columns: calc(var(--circle) + var(--pad) * 2) 1fr;
  grid-template-rows: auto 1fr;
  background: var(--sky);
  padding: 0 10px 10px 0;
  min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.badge {
  grid-column: 1; grid-row: 1;
  align-self: center; justify-self: center;
  width: var(--circle);
  aspect-ratio: 1;
  margin: var(--pad);
  border-radius: 50%;
  background: #ffffff;
  border: 6px solid var(--navy);
  display: grid; place-items: center;
}
.badge img { width: 60%; height: auto; display: block; }
.page header {
  grid-column: 2; grid-row: 1;
  align-self: center;
  padding: var(--pad) var(--pad) var(--pad) 0;
  text-align: left;
}
.page h1 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(2rem, 7vw, 6rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.tagline {
  margin: 14px 0 0;
  max-width: 60ch;
  color: var(--ink);
  font-size: 1rem;
  font-weight: 500;
  line-height: 1.5;
}
.panel {
  grid-column: 2; grid-row: 2;
  background: #ffffff;
  min-height: 200px;
}

.panel { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; padding: 18px; align-items: start; }
.video { position: relative; background: #0f172a; aspect-ratio: 16 / 9; overflow: hidden; }
.video img { width: 100%; height: 100%; object-fit: contain; display: block; }
.video p { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: #e2e8f0; }
.video p[hidden] { display: none; }
.stats { margin: 10px 0 0; color: var(--ink); font-size: .9375rem; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; font-size: .9375rem; color: var(--ink); }
.controls label { display: inline-flex; align-items: center; gap: 6px; }
.controls button { font: inherit; font-weight: 600; color: var(--navy); background: #fff; border: 2px solid var(--navy); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.controls button:hover { background: var(--sky); }
.controls button.danger { border-color: #b91c1c; color: #b91c1c; }
.controls button.danger:hover { background: #fee2e2; }
.controls button:focus-visible, .controls input:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -2px; }
.seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button.on { background: var(--navy); color: #fff; }
.log h2 { margin: 0 0 10px; font-size: 1.125rem; color: var(--navy); }
.log ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-height: 70vh; overflow-y: auto; }
.log #empty { margin: 0; color: var(--ink); line-height: 1.5; }
.log li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 10px; border: 2px solid var(--sky); }
.log li img { width: 96px; height: 72px; object-fit: cover; background: #e2e8f0; display: block; }
.log .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--navy); }
.log .when { font-size: .8125rem; color: var(--ink); margin: 2px 0 4px; }
.log .sum { margin: 0; font-size: .875rem; line-height: 1.45; color: var(--text); }
.badge-r { font-size: .8125rem; padding: 1px 8px; border-radius: 99px; background: var(--sky); color: var(--navy); white-space: nowrap; }
.badge-r.hi { background: #fee2e2; color: #991b1b; }
.badge-r.mid { background: #fef3c7; color: #92400e; }
@media (max-width: 900px) { .panel { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .badge { border-width: 4px; }
  .tagline { font-size: .9375rem; }
}
</style>
</head>

  <header>
    <h1>Tetsa</h1>
    <p class="tagline">Sight meets intelligence: A third eye with a brain.</p>
  </header>
  <main class="panel">
    <section class="feed">
      <div class="video">
        <img id="video" alt="Live camera view">
        <p id="offline" hidden>Cannot reach the backend. Start it with <code>py main.py</code>, then reload this page.</p>
      </div>
      <p class="stats" id="stats" aria-live="polite"></p>
      <div class="controls">
        <div class="seg" role="group" aria-label="Video source">
          <button type="button" data-src="live">Live camera</button>
          <button type="button" data-src="video">Recorded video</button>
        </div>
        <label><input type="checkbox" id="c-armed"> Armed</label>
        <label><input type="checkbox" id="c-muted"> Mute buzzer</label>
        <label><input type="checkbox" id="c-patrol"> Patrol when idle</label>
        <label><input type="checkbox" id="c-light"> Light on</label>
        <button type="button" id="b-center">Center camera</button>
        <button type="button" id="b-test">Send test alert</button>
        <button type="button" id="b-reset" class="danger">Reset saved data</button>
      </div>
    </section>
    <section class="log">
      <h2>Incidents</h2>
      <p id="empty">No incidents yet. Alerts show up here with their photos and the agent's report.</p>
      <ul id="incidents"></ul>
    </section>
  </main>
</div>
</div>
<div class="version">version 2.1.2</div>
<script>
(function () {
  var btn = document.getElementById('connect');
  var label = document.getElementById('label');
  var status = document.getElementById('status');
  // Change to the Python server address once the backend exists.
  var BACKEND = '/api/health';
  
  var SIMULATE = false;

  function setStatus(msg, isErr) {
    status.textContent = msg;
    status.className = 'status' + (isErr ? ' err' : '');
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function check() {
    if (SIMULATE) { await wait(1400); return { camera: true, turret: true }; }
    var res = await fetch(BACKEND, { cache: 'no-store' });
    if (!res.ok) throw new Error('Server error (' + res.status + ')');
    return res.json();
  }

  var demo = document.getElementById('demo');
  var introEl = document.getElementById('intro');
  var dashEl = document.getElementById('dashboard');
  function render() {
    var onDash = location.hash === '#dashboard';
    introEl.hidden = onDash;
    dashEl.hidden = !onDash;
    document.body.classList.toggle('intro-mode', !onDash);
    document.querySelector('.version').hidden = onDash;
    window.scrollTo(0, 0);
  }
  function showDashboard() { try { location.hash = 'dashboard'; } catch (e) {} render(); }
  window.addEventListener('hashchange', render);
  render();
  // Demo: open the dashboard without connecting to any device
  demo.addEventListener('click', showDashboard);

  btn.addEventListener('click', async function () {
    btn.disabled = true; demo.disabled = true;
    label.textContent = 'Connecting…';
    setStatus('Checking the camera and turret…', false);
    try {
      var r = await check();
      if (!r.camera) throw new Error('Camera not found. Start DroidCam and try again.');
      if (!r.turret) throw new Error('Turret not found. Plug in the ESP32 and try again.');
      label.textContent = 'Connected';
      setStatus(SIMULATE ? 'Device ready.' : 'Device ready.', false);
      await wait(900);
      showDashboard();
    } catch (e) {
      label.textContent = 'Connect to device';
      var msg = e && e.message ? e.message : 'Unknown error';
      if (/failed to fetch|networkerror/i.test(msg)) msg = 'Backend not running. Start the Python server and try again.';
      setStatus(msg, true);
    } finally {
      btn.disabled = false; demo.disabled = false;
    }
  });
})();
</script>

<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var api = function (p, o) { return fetch(p, o).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); };
  var post = function (p, b) { return api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }); };
  var busy = false;

  function stats(st) {
    var c = Object.keys(st.counts).map(function (k) { return st.counts[k] + ' ' + k; }).join(', ') || 'nothing detected';
    var parts = ['Mode: ' + st.mode, st.fps + ' fps', st.camera_name + (st.restricted ? ' (restricted hours)' : ''),
      'Pan ' + st.pan + '\u00b0, tilt ' + st.tilt + '\u00b0', 'Turret ' + (st.turret ? 'connected' : 'not connected'),
      'AI agent ' + (st.agent ? 'ready' : 'no key, using rules'), 'Telegram ' + (st.telegram ? 'ready' : 'not set up'), c];
    if (st.error) parts.push(st.error);
    $('stats').textContent = parts.join('  |  ');
  }
  function render(st) {
    $('offline').hidden = true;
    stats(st);
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.src === st.source); });
    [['c-armed', 'armed'], ['c-muted', 'muted'], ['c-patrol', 'patrol'], ['c-light', 'light']].forEach(function (m) {
      if (document.activeElement !== $(m[0])) $(m[0]).checked = !!st[m[1]];
    });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function log(list) {
    $('empty').hidden = list.length > 0;
    var ul = $('incidents'); ul.textContent = '';
    list.forEach(function (i) {
      var li = el('li'), a = el('a'), img = el('img');
      a.href = '/incidents/' + i.id + '/scene'; a.target = '_blank'; a.rel = 'noopener';
      img.src = '/incidents/' + i.id + '/object'; img.alt = 'Detected ' + i.label;
      img.onerror = function () { img.src = '/incidents/' + i.id + '/scene'; };
      a.appendChild(img); li.appendChild(a);
      var box = el('div'), top = el('div', 'top');
      top.appendChild(el('span', '', 'Possible ' + i.label + ' (' + Math.round(i.conf * 100) + '%)'));
      var risk = i.status === 'Analysing' ? 'Analysing' : i.status + ' ' + i.risk + '/10';
      top.appendChild(el('span', 'badge-r' + (i.risk >= 8 ? ' hi' : i.risk >= 6 ? ' mid' : ''), risk));
      box.appendChild(top);
      box.appendChild(el('p', 'when', i.ts + '  |  ' + i.camera + (i.source === 'rules' ? '  |  unverified' : '')));
      box.appendChild(el('p', 'sum', i.summary));
      li.appendChild(box); ul.appendChild(li);
    });
  }
  function onDash() { return location.hash === '#dashboard'; }
  function poll() {
    if (!onDash() || busy) return;
    api('/api/state').then(render).catch(function () { $('offline').hidden = false; });
    api('/api/incidents').then(log).catch(function () {});
  }
  function sync() { $('video').src = onDash() ? '/video' : ''; $('offline').hidden = true; poll(); }
  function act(p, b) { busy = true; return post(p, b).then(render).catch(function () { $('offline').hidden = false; }).then(function () { busy = false; }); }

  document.querySelectorAll('.seg button').forEach(function (b) { b.addEventListener('click', function () { act('/api/source', { mode: b.dataset.src }); }); });
  [['c-armed', 'armed'], ['c-muted', 'muted'], ['c-patrol', 'patrol'], ['c-light', 'light']].forEach(function (m) {
    $(m[0]).addEventListener('change', function () { var o = {}; o[m[1]] = $(m[0]).checked; act('/api/control', o); });
  });
  $('b-center').addEventListener('click', function () { act('/api/center'); });
  $('b-test').addEventListener('click', function () { post('/api/test-alert').then(poll).catch(function () { alert('No camera frame yet. Start the camera first.'); }); });
  $('b-reset').addEventListener('click', function () {
    if (confirm('Delete all saved incidents and photos? This cannot be undone.')) post('/api/reset').then(poll);
  });
  window.addEventListener('hashchange', sync);
  setInterval(poll, 1000); sync();
})();
</script>
</body>
