<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tetsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #ffffff;
  --wash: #bae6fd;
  --wash-soft: #e0f2fe;
  --ring: #7dd3fc;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --disc: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --err: #b91c1c;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
.stage {
  position: relative;
  height: 100%;
  display: grid;
  place-items: center;
}

.content {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(28px, 6vh, 48px);
  padding: 24px;
  text-align: center;
}
/* light sky blue circle: grows from its middle, stays a bounded circle */
.disc {
  position: relative;
  width: clamp(220px, 44vmin, 380px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--wash);
  display: grid; place-items: center;
}
.content > .disc {
  opacity: 1;
  transform: scale(0);
  animation: grow 1.3s cubic-bezier(.16,.8,.24,1) .1s forwards;
}
@keyframes grow { to { transform: scale(1); } }
.disc svg { width: 64%; height: auto; opacity: 0; animation: show .5s ease .9s forwards; }
.disc .lens { transform-box: fill-box; transform-origin: center; animation: focus 3.4s ease-in-out 1.2s 1; }
@keyframes focus { 0%,100% { transform: scale(1); } 45% { transform: scale(1.22); } }

h1 { margin: 0; font-size: clamp(1.5rem, 3.4vw, 2rem); font-weight: 700; letter-spacing: -0.01em; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 1rem; font-weight: 500; }

.btn {
  appearance: none; border: 0; cursor: pointer;
  background: var(--blue); color: #fff;
  font: 600 1.0625rem/1 "Manrope", system-ui, sans-serif;
  padding: 16px 34px; min-width: 220px;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: background .15s, transform .08s;
}
.btn:hover { background: var(--blue-dark); }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.btn[disabled] { cursor: progress; background: var(--blue-dark); }
.spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: rot .8s linear infinite; display: none; }
.btn[disabled] .spin { display: inline-block; }
@keyframes rot { to { transform: rotate(360deg); } }
.status { min-height: 1.4em; margin: 0; font-size: .95rem; color: var(--muted); }
.status.err { color: var(--err); }

/* single reveal after the wash starts */
.content > * { opacity: 0; animation: show .6s ease 0.9s forwards; }
.content > .btn { animation-delay: 1.2s; }
@keyframes show { to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .content > .disc { animation: none; transform: scale(1); }
  .disc svg { animation: none; opacity: 1; }
  .content > * { animation: none; opacity: 1; }
  .disc .lens { animation: none; }
}
</style>
</head>
<body>
<main class="stage">
  <div class="content">
    <div class="disc" aria-hidden="true">
      <svg viewBox="0 0 160 120" role="img" aria-label="Security camera">
        <defs>
          <radialGradient id="glass" cx="38%" cy="36%" r="75%">
            <stop offset="0" stop-color="#c4b5fd"/><stop offset=".4" stop-color="#5b21b6"/><stop offset="1" stop-color="#0b0614"/>
          </radialGradient>
        </defs>
        <rect x="14" y="58" width="10" height="56" rx="3" fill="#4b5563"/>
        <path d="M24 100 H46 L54 84" fill="none" stroke="#6b7280" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="rotate(10 80 60)">
          <rect x="36" y="42" width="90" height="38" rx="12" fill="#f3f4f6"/>
          <rect x="36" y="68" width="90" height="12" rx="6" fill="#d1d5db"/>
          <rect x="30" y="34" width="100" height="13" rx="6.5" fill="#374151"/>
          <rect x="118" y="46" width="20" height="30" rx="7" fill="#1f2937"/>
          <circle cx="56" cy="58" r="3.5" fill="#ef4444"/>
          <rect x="68" y="55" width="30" height="6" rx="3" fill="#9ca3af"/>
          <g class="lens">
            <ellipse cx="134" cy="61" rx="7" ry="12" fill="url(#glass)"/>
            <ellipse cx="132" cy="55" rx="2.2" ry="3.4" fill="#fff" opacity=".75"/>
          </g>
        </g>
        <circle cx="54" cy="84" r="8" fill="#6b7280"/>
        <circle cx="54" cy="84" r="3" fill="#374151"/>
      </svg>
    </div>
    <div>
      <h1>Tetsa</h1>
      <p class="sub">Pan-tilt sentry</p>
    </div>
    <button class="btn" id="connect" type="button"><span class="spin"></span><span id="label">Connect to device</span></button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</main>
<script>
(function () {
  var btn = document.getElementById('connect');
  var label = document.getElementById('label');
  var status = document.getElementById('status');
  // Change to the Python server address once the backend exists.
  var BACKEND = 'http://localhost:8000/api/health';
  var DASHBOARD = 'dashboard.html';
  var SIMULATE = true; // no backend yet: fake a successful check

  function setStatus(msg, isErr) {
    status.textContent = msg;
    status.className = 'status' + (isErr ? ' err' : '');
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function check() {
    if (SIMULATE) { await wait(1400); return { camera: true, turret: true }; }
    var res = await fetch(BACKEND, { cache: 'no-store' });
    if (!res.ok) throw new Error('Server error (' + res.status + ')');
    return res.json();
  }

  btn.addEventListener('click', async function () {
    btn.disabled = true;
    label.textContent = 'Connecting…';
    setStatus('Checking the camera and turret…', false);
    try {
      var r = await check();
      if (!r.camera) throw new Error('Camera not found. Start DroidCam and try again.');
      if (!r.turret) throw new Error('Turret not found. Plug in the ESP32 and try again.');
      label.textContent = 'Connected';
      setStatus(SIMULATE ? 'Demo mode: backend not connected yet.' : 'Device ready.', false);
      await wait(900);
      // window.location.href = DASHBOARD; // enable when the dashboard exists
    } catch (e) {
      label.textContent = 'Connect to device';
      var msg = e && e.message ? e.message : 'Unknown error';
      if (/failed to fetch|networkerror/i.test(msg)) msg = 'Backend not running. Start the Python server and try again.';
      setStatus(msg, true);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
